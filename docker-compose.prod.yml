# Production stack for a small shared server. Nothing is published to the internet:
# the bot only makes outbound connections (Discord, AssemblyAI, Anthropic).
#
#   cp .env.example .env     # fill in keys (see deploy/README.md)
#   docker compose -f docker-compose.prod.yml up -d --build

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgresql://dnd:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dnd_recorder
    REDIS_URL: redis://redis:6379/0
    AUDIO_STORAGE_PATH: /data/audio
    DELETE_AUDIO_AFTER_REPORT: "true"
  volumes:
    - audio:/data/audio
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dnd_recorder
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_recorder"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  bot:
    <<: *app
    command: ["python", "-m", "src.bot.main"]
    mem_limit: 768m
    cpus: 1.0

  worker:
    <<: *app
    # Low priority so the website on the same machine stays responsive during ffmpeg work.
    command: ["nice", "-n", "15", "python", "-m", "celery", "-A", "src.processing.celery_app",
              "worker", "--concurrency=1", "--loglevel=info"]
    mem_limit: 1g
    cpus: 1.0

volumes:
  postgres_data:
  audio:
